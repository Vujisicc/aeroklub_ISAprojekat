<body>
<main>
  <h1>✈ Aeroklub Organizacija Aktivnosti</h1>
  <div id="msg" role="status"></div>

  <section id="auth" class="card">
    <div class="tabs">
      <button data-tab="login" class="active">Login</button>
      <button data-tab="register">Registracija</button>
    </div>
    <form id="loginForm">
      <input id="lUser" placeholder="Username" required autocomplete="username">
      <input id="lPass" type="password" placeholder="Password" required autocomplete="current-password">
      <button>Login</button>
    </form>
    <form id="registerForm" hidden>
      <input id="rUser" placeholder="Username (min 3)" required minlength="3" autocomplete="username">
      <input id="rEmail" type="email" placeholder="Email" required>
      <input id="rPass" type="password" placeholder="Password (min 6)" required minlength="6" autocomplete="new-password">
      <select id="rRole"><option value="USER">Korisnik</option><option value="PILOT">Pilot</option></select>
      <button>Registracija</button>
    </form>
  </section>

  <!-- onaj gore djavo -->
  <section id="dash" hidden>
    <div class="card bar"><strong id="who"></strong><button id="logout" class="secondary">Logout</button></div>

    <!-- analitika -->
    <div class="card">
      <h2>Ukupno sati leta po jedrilici</h2>
      <div id="chartWrap"><canvas id="hoursChart"></canvas></div>
    </div>

    <!-- unos letova -->
    <form id="fForm" class="card">
      <h3>Unesi novi let</h3>
      <input id="fDate" type="date" required>
      <input id="fDuration" type="number" min="1" max="1440" placeholder="Trajanje (minuti)" required>
      <select id="fLaunch"><option value="WINCH">Vitlo</option><option value="TOW">Aerozaprega</option></select>
      <select id="fGlider" required><option value="">Izaberi jedrilicu…</option></select>
      <button>Unesi let</button>
    </form>

    <!-- tabela za letove -->
    <div class="card table-wrap">
      <h2>Log letova</h2>
      <table>
        <thead><tr><th>Datum</th><th>Jedrilica</th><th>Trajanje</th><th>Poletanje</th><th>Pilot</th></tr></thead>
        <tbody id="flightTbody"></tbody>
      </table>
    </div>

    <hr class="divider">

    <!-- za admine deo -->
    <div id="admin-section" style="display:none;">
      <div class="card bar"><h2 style="margin:0">Upravljanje flotom (Admin)</h2></div>

      <form id="gForm" class="card">
        <h3 id="formTitle">Unesi novu jedrilicu</h3>
        <input type="hidden" id="gId">
        <input id="gReg" placeholder="Registracija (npr. YU-1234)" required maxlength="20">
        <input id="gModel" placeholder="Model" required>
        <input id="gYear" type="number" min="1900" max="2100" placeholder="Godina" required>
        <select id="gStatus"><option>AKTIVNA</option><option>ODRŽAVANJE</option></select>
        <button>Sačuvaj</button>
        <button type="button" id="gCancel" class="secondary">Očisti</button>
      </form>

      <div class="card table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Registracija</th><th>Model</th><th>Godina</th><th>Status</th><th>Modifikuj</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
