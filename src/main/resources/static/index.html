<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aeroklub – Glider Fleet</title>
<style>
  :root{--bg:#f2f6fb;--card:#fff;--pri:#1e6fd9;--txt:#1b2733;--bad:#d64545;--ok:#2f9e5b;--mut:#6b7c8f}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--txt)}
  [hidden]{display:none!important}
  main{max-width:920px;margin:2rem auto;padding:0 1rem}
  h1{font-size:1.5rem;margin:0 0 1rem}
  .card{background:var(--card);border-radius:10px;padding:1.1rem;box-shadow:0 2px 8px #0001;margin-bottom:1rem}
  .bar{display:flex;justify-content:space-between;align-items:center}
  form{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
  form h3{flex-basis:100%;margin:0}
  input,select{padding:.55rem .7rem;border:1px solid #c9d4e0;border-radius:6px;font:inherit;flex:1 1 150px}
  button{padding:.55rem 1rem;border:0;border-radius:6px;background:var(--pri);color:#fff;font:inherit;cursor:pointer}
  button.secondary{background:var(--mut)} button.danger{background:var(--bad)}
  button:hover{filter:brightness(1.08)}
  .tabs{display:flex;gap:.5rem;margin-bottom:.8rem}
  .tabs button{background:#e4ecf6;color:var(--txt)} .tabs button.active{background:var(--pri);color:#fff}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:.6rem;border-bottom:1px solid #e6edf5;white-space:nowrap}
  th{color:var(--mut);font-size:.8rem;text-transform:uppercase}
  .badge{padding:.15rem .55rem;border-radius:99px;font-size:.78rem;color:#fff}
  .badge.ACTIVE{background:var(--ok)} .badge.MAINTENANCE{background:#e0a100}
  #msg{min-height:1.4rem;margin-bottom:.6rem;font-weight:600}
  #msg.ok{color:var(--ok)} #msg.err{color:var(--bad)}
</style>
</head>
<body>
<main>
  <h1>✈ Aeroklub Glider Fleet</h1>
  <div id="msg" role="status"></div>

  <!-- AUTH -->
  <section id="auth" class="card">
    <div class="tabs">
      <button data-tab="login" class="active">Login</button>
      <button data-tab="register">Register</button>
    </div>
    <form id="loginForm">
      <input id="lUser" placeholder="Username" required autocomplete="username">
      <input id="lPass" type="password" placeholder="Password" required autocomplete="current-password">
      <button>Login</button>
    </form>
    <form id="registerForm" hidden>
      <input id="rUser" placeholder="Username (min 3)" required minlength="3" autocomplete="username">
      <input id="rEmail" type="email" placeholder="Email" required>
      <input id="rPass" type="password" placeholder="Password (min 6)" required minlength="6" autocomplete="new-password">
      <select id="rRole"><option value="USER">User</option><option value="PILOT">Pilot</option></select>
      <button>Register</button>
    </form>
  </section>

  <!-- DASHBOARD -->
  <section id="dash" hidden>
    <div class="card bar"><strong id="who"></strong><button id="logout" class="secondary">Logout</button></div>

    <form id="gForm" class="card" hidden>
      <h3 id="formTitle">Add glider</h3>
      <input type="hidden" id="gId">
      <input id="gReg" placeholder="Registration (e.g. D-1234)" required maxlength="20">
      <input id="gModel" placeholder="Model" required>
      <input id="gYear" type="number" min="1900" max="2100" placeholder="Year" required>
      <select id="gStatus"><option>ACTIVE</option><option>MAINTENANCE</option></select>
      <button>Save</button>
      <button type="button" id="gCancel" class="secondary">Clear</button>
    </form>

    <div class="card table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Registration</th><th>Model</th><th>Year</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
